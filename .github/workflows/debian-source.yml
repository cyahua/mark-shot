name: Debian source package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  resolute:
    name: Ubuntu 26.04 Resolute source and binary package
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04

    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            devscripts \
            equivs \
            git \
            lintian

      - name: Check out packaging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install declared build dependencies
        run: |
          mk-build-deps --install --remove \
            --tool 'apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends -y' \
            debian/control

      # Launchpad 构建无网络，Rust crate 以 orig-vendor 组件随源码包上传
      - name: Install Rust vendoring tool
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/cargo-tools"
          cargo install --locked cargo-vendor-filterer@0.5.18
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Create source package from the checked-out revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          DEBIAN_VERSION="$(dpkg-parsechangelog -SVersion)"
          UPSTREAM_VERSION="${DEBIAN_VERSION%%-*}"
          # 1. 【源码打包】【持续集成】验证当前提交，避免遗漏新改动或依赖尚未发布的标签
          SOURCE_REF="$(git rev-parse --verify HEAD)"

          SOURCE_ROOT="$(bash scripts/packaging/prepare-debian-source.sh \
            --version "$UPSTREAM_VERSION" \
            --output-dir "$RUNNER_TEMP" \
            --git-ref "$SOURCE_REF" | sed -n 's/^source_root=//p')"
          test -d "$SOURCE_ROOT/vendor"

          (cd "$SOURCE_ROOT" && dpkg-buildpackage -S -us -uc)
          DSC="$(find "$RUNNER_TEMP" -maxdepth 1 -name "mark-shot_${DEBIAN_VERSION}.dsc" -print -quit)"
          test -n "$DSC"
          {
            echo "debian_version=$DEBIAN_VERSION"
            echo "dsc=$DSC"
          } >> "$GITHUB_OUTPUT"

      - name: Build the binary from the generated source package
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/source-build"
          dpkg-source -x "${{ steps.source.outputs.dsc }}" "$BUILD_ROOT"
          (cd "$BUILD_ROOT" && dpkg-buildpackage -b -us -uc)

      - name: Run Lintian
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r changes; do
            lintian --display-info --pedantic --fail-on error "$changes"
          done < <(find "$RUNNER_TEMP" -maxdepth 1 -name 'mark-shot_*.changes' -print)

      - name: Install and inspect the package
        shell: bash
        run: |
          set -euo pipefail
          DEB="$(find "$RUNNER_TEMP" -maxdepth 1 -name 'mark-shot_*_*.deb' -print -quit)"
          test -n "$DEB"
          apt-get install -y "$DEB" desktop-file-utils
          apt-get check
          QT_QPA_PLATFORM=offscreen /usr/bin/mark-shot --version
          debian/tests/smoke
          dpkg-deb --contents "$DEB"
          dpkg-deb --info "$DEB"
          test "$(stat -c '%a' /usr/bin/mark-shot)" = 755
          test "$(stat -c '%U:%G' /usr/bin/mark-shot)" = root:root

      - name: Collect package artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find "$RUNNER_TEMP" -maxdepth 1 -type f \
            \( -name 'mark-shot_*.dsc' \
               -o -name 'mark-shot_*.tar.*' \
               -o -name 'mark-shot_*.changes' \
               -o -name 'mark-shot_*.buildinfo' \
               -o -name 'mark-shot_*.deb' \) \
            -exec cp -v {} artifacts/ \;

      - name: Upload package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mark-shot-${{ steps.source.outputs.debian_version }}-resolute
          path: artifacts/
          if-no-files-found: error
