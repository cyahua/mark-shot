[workspace]
members = ["crates/shot-geometry", "crates/shot-image", "crates/shot-stitch", "crates/shot-config", "crates/shot-editor", "crates/shot-ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tempfile = "3.27.0"
fs2 = "0.4.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.dev.package.shot-image]
opt-level = 2

[profile.dev.package.shot-stitch]
opt-level = 2
